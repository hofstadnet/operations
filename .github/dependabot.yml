# Dependabot åpner PR-er når det kommer nye versjoner av Actions. Én samlet PR i måneden. Repoet har ingen pakker.
# cooldown: nye versjoner foreslås først etter 7 dager (major etter 30 for økosystemer som støtter det, ikke github-actions), så en kompromittert release rekker å bli oppdaget.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
