name: Utløper snart

# Varsler om tokens, security.txt og domenet før de utløper (expiry.json: bare navn og datoer, aldri verdier).
# Hver mandag: for hvert element som utløper innen notify_days (45 hvis ikke satt), eller har utløpt, lages en sak
# (én per element, med navnet i tittelen). Saken lukkes av seg selv når datoen er flyttet fram i fila. Kjører ingen kode
# fra repoet utover å lese fila. På en pull request som endrer fila, sjekkes bare at den er gyldig.

on:
  schedule:
    - cron: "37 6 * * 1" # mandager 06:37 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [expiry.json, .github/workflows/expiry.yml]
  # På en pull request som endrer fila, sjekkes bare at den er gyldig.
  pull_request:
    paths: [expiry.json, .github/workflows/expiry.yml]

permissions: {}

jobs:
  expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: expiry.json
          sparse-checkout-cone-mode: false

      - name: Sjekk utløpsdatoene
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          file=expiry.json
          # Gyldig fil: navn på alle, og datoer som YYYY-MM-DD eller null
          jq -e '.items | type == "array" and length > 0 and all(.[]; (.name | type == "string" and length > 0) and (.expires == null or (.expires | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))))' "$file" > /dev/null \
            || { echo "::error::$file er ugyldig: hvert element trenger «name» og «expires» som YYYY-MM-DD eller null"; exit 1; }
          today=$(date -u +%F)
          summary="| Hva | Utløper | Dager igjen |"$'\n'"|---|---|---|"
          while IFS= read -r e; do
            name=$(jq -r .name <<< "$e"); date=$(jq -r '.expires // empty' <<< "$e"); notify=$(jq -r '.notify_days // 45' <<< "$e")
            title="Utløper snart: $name"
            if [ -z "$date" ]; then
              summary+=$'\n'"| $name | – | $(jq -r '.note // "utløper ikke"' <<< "$e") |"
              continue
            fi
            left=$(( ($(date -u -d "$date" +%s) - $(date -u -d "$today" +%s)) / 86400 ))
            summary+=$'\n'"| $name | $date | $left |"
            [ "$EVENT" = "pull_request" ] && continue
            n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ "$left" -le "$notify" ]; then
              if [ -z "$n" ]; then
                if [ "$left" -lt 0 ]; then status="**utløpte $date** ($(( -left )) dager siden)"; else status="utløper **$date** (om $left dager)"; fi
                gh issue create --title "$title" --body "$name $status.

          - **Brukes av:** $(jq -r '.used_by // "–"' <<< "$e")
          - **Slik fornyes det:** $(jq -r '.renew // "–"' <<< "$e")

          Når det er fornyet: sett ny dato for «$name» i \`expiry.json\` (pull request). Da lukkes saken av seg selv neste mandag, eller med en gang når endringen er merget."
                echo "::warning::$name: $left dager igjen, sak opprettet"
              else
                echo "::warning::$name: $left dager igjen, sak #$n er allerede åpen"
              fi
            elif [ -n "$n" ]; then
              gh issue close "$n" --comment "Fornyet: ny utløpsdato $date i expiry.json."
            fi
          done < <(jq -c '.items[]' "$file")
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
